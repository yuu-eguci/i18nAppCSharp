name: CI

# Build and test only. This workflow must never deploy anywhere.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Keep the .NET SDK and Microsoft.Testing.Platform from sending telemetry.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # dotnet format in --folder mode does not load the projects, so it runs on Linux.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check C# whitespace
        run: dotnet format whitespace . --folder --verify-no-changes

  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      # Fail on NuGet audit warnings for packages with known vulnerabilities.
      - name: Restore
        run: |
          $log = nuget restore i18nApp.sln 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($log -match 'NU190[1-4]') { Write-Error 'Packages with known vulnerabilities were found.'; exit 1 }

      # PrecompileBeforePublish compiles the Razor views too.
      # The Web Deploy package stays in obj\Release\Package on the runner and is not uploaded.
      - name: Build
        run: msbuild i18nApp.sln /m /nologo -warnaserror /p:Configuration=Release /p:DeployOnBuild=true /p:PrecompileBeforePublish=true

      - name: Test
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\vstest.console.exe" | Select-Object -First 1
          & $vstest i18nApp.Tests\bin\Release\i18nApp.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The runner is disposable, so installing IIS here does not touch any shared host.
      - name: Host in IIS
        run: |
          Install-WindowsFeature Web-Server, Web-Asp-Net45 | Out-Null
          Copy-Item i18nApp\obj\Release\Package\PackageTmp C:\inetpub\i18nApp -Recurse
          & "$env:windir\System32\inetsrv\appcmd.exe" add site /name:i18nApp /bindings:http/*:8080: /physicalPath:C:\inetpub\i18nApp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (PowerShell 7)
        run: ./scripts/smoke-test.ps1 -BaseUrl http://localhost:8080

      - name: Smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/smoke-test.ps1 -BaseUrl http://localhost:8080
